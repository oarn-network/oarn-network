# oarn-ip.conf — Nginx config for raw IP access (before domain is set up)
# Replace SERVER_IP with your actual server IP
# Once domain is live, switch to oarn-domain.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # API gateway
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # IPFS gateway (public read-only)
    location /ipfs/ {
        proxy_pass http://127.0.0.1:8080/ipfs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    # Static website (placeholder until domain)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
