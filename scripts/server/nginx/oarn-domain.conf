# oarn-domain.conf — Nginx config after DNS is pointed to server
# Activate with: certbot --nginx -d oarn.network -d www.oarn.network -d api.oarn.network
# Certbot will auto-add SSL blocks below

server {
    listen 80;
    server_name oarn.network www.oarn.network;
    return 301 https://oarn.network$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oarn.network www.oarn.network;
    # SSL added by Certbot

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/oarn.network;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|png|jpg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/oarn.access.log;
    error_log  /var/log/nginx/oarn.error.log;
}

server {
    listen 80;
    server_name api.oarn.network;
    return 301 https://api.oarn.network$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.oarn.network;
    # SSL added by Certbot

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;
}
