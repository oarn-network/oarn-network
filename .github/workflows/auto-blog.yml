name: Auto Blog Post

on:
  push:
    branches: [main]

jobs:
  auto-blog:
    name: Draft and publish blog post if warranted
    runs-on: ubuntu-latest

    # Skip bot commits (avoids feedback loops)
    if: "!contains(github.event.head_commit.author.name, 'bot')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auto-blog script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_PAT: ${{ secrets.BLOG_PAT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/auto-blog.js
