name: Weekly Leaderboard Snapshot

on:
  schedule:
    - cron: '59 23 * * 0'  # Every Sunday at 23:59 UTC
  workflow_dispatch:         # Manual trigger from GitHub Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Needed to commit leaderboard/current.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # Submodules not needed for snapshot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install snapshot dependencies
        run: npm install --prefix scripts

      - name: Run snapshot
        run: node scripts/snapshot.js
        env:
          RPC_URL: https://sepolia-rollup.arbitrum.io/rpc

      - name: Commit leaderboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/current.md leaderboard/.snapshot-count
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: weekly leaderboard snapshot $(date -u +%Y-%m-%d)" &&
            git push
          )

      - name: Post weekly summary to Discord
        run: node scripts/discord-snapshot.mjs
        env:
        # Posts to #node-ops-leaderboard — uses WEB_HOOK_TASKS secret
        DISCORD_WEBHOOK: ${{ secrets.WEB_HOOK_TASKS }}
